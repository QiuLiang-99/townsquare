services:
  townsquare:
    image: ${IMAGE_REF:-ghcr.io/nodisease/townsquare:main}
    container_name: townsquare
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      RATE_LIMIT: ${RATE_LIMIT:-30}
      ROOM_GRACE_MS: ${ROOM_GRACE_MS:-60000}
      AVATAR_DIR: /data/avatars
      FLOATING_NOTICE: ${FLOATING_NOTICE:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - avatars:/data/avatars
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  avatars:
    name: ${AVATAR_VOLUME:-townsquare_avatars}
